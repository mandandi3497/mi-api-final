openapi: "3.0.3"

info:
  title: "Mi API Final"
  description: "API REST para gestionar saludos, usuarios y autenticación mediante JWT."
  version: "1.0.0"

servers:
  - url: "/"
    description: "Servidor de la API"

tags:
  - name: "Saludos"
    description: "Endpoints de saludos y comprobación."
  - name: "Autenticación"
    description: "Inicio de sesión mediante JWT."
  - name: "Usuarios"
    description: "Consulta protegida de usuarios."

paths:
  "/api/v1/hello":
    get:
      tags:
        - "Saludos"
      summary: "Comprobar que la API funciona"
      responses:
        "200":
          description: "La API responde correctamente."
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: "Hola Mundo"

  "/api/v1/saludo/{nombre}":
    get:
      tags:
        - "Saludos"
      summary: "Saludar a una persona"
      parameters:
        - name: "nombre"
          in: "path"
          required: true
          description: "Nombre de la persona a la que saludar."
          schema:
            type: string
          example: "Amanda"
      responses:
        "200":
          description: "Saludo generado correctamente."
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: "Hola, Amanda!"

  "/api/v1/login":
    post:
      tags:
        - "Autenticación"
      summary: "Iniciar sesión y obtener un token JWT"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - "email"
                - "password"
              properties:
                email:
                  type: string
                  format: email
                  example: "usuario@ejemplo.com"
                password:
                  type: string
                  format: password
                  example: "contraseña-de-ejemplo"
      responses:
        "200":
          description: "Inicio de sesión correcto."
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: "Autenticación correcta."
                  token:
                    type: string
                    description: "Token JWT para las solicitudes protegidas."
        "400":
          description: "Faltan las credenciales."
        "401":
          description: "Las credenciales son incorrectas."
        "500":
          description: "Error de configuración o error interno del servidor."

  "/api/v1/usuarios":
    get:
      tags:
        - "Usuarios"
      summary: "Consultar usuarios"
      description: "Devuelve los usuarios de MongoDB. Requiere un token JWT válido."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Usuarios consultados correctamente."
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: "Lista de usuarios obtenida correctamente."
                  total:
                    type: integer
                    example: 2
                  usuarios:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "671234567890abcdef123456"
                        nombre:
                          type: string
                          example: "Usuario de ejemplo"
                        email:
                          type: string
                          format: email
                          example: "usuario@ejemplo.com"
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
        "401":
          description: "Falta el token o no es válido."
        "500":
          description: "No se pudieron consultar los usuarios."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
